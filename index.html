<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>편지왔다롱~ 💌</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, "Noto Sans KR", sans-serif;

    overflow: hidden;
}


/* =========================
   편지 카드
========================= */

.card {
    width: 330px;
    max-width: 85vw;
    height: 500px;

    background: white;

    border-radius: 24px;

    padding: 35px 25px;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    box-shadow:
        0 10px 30px rgba(150, 70, 100, 0.12);

    position: relative;

    overflow: hidden;
}


/* =========================
   화면
========================= */

.screen {
    width: 100%;
    height: 100%;

    display: none;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    animation: fadeIn 0.5s ease;
}

.screen.active {
    display: flex;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================
   봉투
========================= */

.envelope {
    font-size: 75px;

    margin-bottom: 20px;

    animation: envelopeFloat 2s ease-in-out infinite;
}

@keyframes envelopeFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


/* =========================
   제목
========================= */

h1 {
    color: #c94b75;

    font-size: 24px;

    margin: 10px 0 18px;

    line-height: 1.5;
}


/* =========================
   메인 버튼
========================= */

button {
    border: none;

    cursor: pointer;

    font-family: inherit;
}

.main-btn {
    background: #e45b86;

    color: white;

    border-radius: 40px;

    padding: 14px 28px;

    font-size: 16px;

    font-weight: bold;

    box-shadow:
        0 6px 15px rgba(228, 91, 134, 0.25);

    transition: transform 0.2s ease;
}

.main-btn:hover {
    transform: scale(1.05);
}


/* =========================
   질문
========================= */

.question {
    transition:
        opacity 0.4s ease,
        transform 0.4s ease;
}

.question.hide {
    opacity: 0;

    transform: translateY(-10px);
}

.question.show {
    opacity: 1;

    transform: translateY(0);
}


/* =========================
   버튼 영역
========================= */

.choices {
    width: 100%;
    height: 150px;

    position: relative;

    display: flex;

    justify-content: center;
    align-items: flex-start;

    margin-top: 5px;
}


/* =========================
   Yes
========================= */

.choice.yes {
    position: absolute;

    left: 50%;

    top: 10px;

    transform: translateX(-65px);

    background: #e45b86;

    color: white;

    border-radius: 30px;

    padding: 13px 28px;

    font-size: 16px;

    font-weight: bold;

    z-index: 5;

    transition: transform 0.2s ease;
}

.choice.yes:hover {
    transform: translateX(-65px) scale(1.05);
}


/* =========================
   No
========================= */

.choice.no {
    position: absolute;

    left: 50%;

    top: 10px;

    transform: translateX(15px);

    background: #eeeeee;

    color: #888888;

    border-radius: 30px;

    padding: 13px 28px;

    font-size: 16px;

    font-weight: bold;

    z-index: 6;

    transition:
        left 0.35s ease,
        top 0.35s ease,
        transform 0.35s ease;
}


/* =========================
   🙈🎀
========================= */

.cute {
    font-size: 60px;

    line-height: 1;

    margin-bottom: 3px;

    animation: cuteMove 1.5s ease-in-out infinite;
}

@keyframes cuteMove {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(0deg)
            scale(1);
    }

    25% {
        transform:
            translateY(-5px)
            rotate(-3deg)
            scale(1.03);
    }

    50% {
        transform:
            translateY(0)
            rotate(0deg)
            scale(1.06);
    }

    75% {
        transform:
            translateY(-5px)
            rotate(3deg)
            scale(1.03);
    }
}


/* =========================
   나듀.
========================= */

.nadeu {
    color: #c94b75;

    font-size: 10px;

    font-weight: bold;

    margin-top: 0;
}


/* =========================
   하트
========================= */

.floating-heart {
    position: absolute;

    color: #e45b86;

    font-size: 20px;

    pointer-events: none;

    z-index: 20;

    animation:
        heartFly 1.5s ease-out forwards;
}

@keyframes heartFly {

    0% {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            translateY(-180px)
            scale(1.5);
    }
}

</style>
</head>


<body>

<div class="card">


    <!-- =========================
         첫 번째 화면
    ========================== -->

    <div
        class="screen active"
        id="screen1"
    >

        <div class="envelope">
            💌
        </div>

        <h1>
            편지왔다롱~ 💌
        </h1>

        <button
            class="main-btn"
            onclick="nextScreen(2)"
        >
            열어보기 💗
        </button>

    </div>



    <!-- =========================
         두 번째 화면
    ========================== -->

    <div
        class="screen"
        id="screen2"
    >

        <!-- 첫 번째 질문 -->

        <h1
            id="question1"
            class="question show"
        >
            나 사랑하지?? 🥺
        </h1>


        <!-- 두 번째 질문 -->

        <h1
            id="question2"
            class="question"
            style="display: none;"
        >
            나 보고싶지?? 💗
        </h1>


        <!-- 버튼 -->

        <div class="choices">

            <button
                class="choice yes"
                id="yesButton"
                onclick="yesClick()"
            >
                Yes
            </button>


            <button
                class="choice no"
                id="noButton"
            >
                No
            </button>

        </div>

    </div>



    <!-- =========================
         세 번째 화면
    ========================== -->

    <div
        class="screen"
        id="screen3"
    >

        <div class="cute">
            🙈🎀
        </div>

        <div class="nadeu">
            나듀.
        </div>

    </div>

</div>



<script>

let questionNumber = 1;

let noMoveTimer = null;


/* =========================
   화면 이동
========================= */

function nextScreen(number) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });


    document
        .getElementById("screen" + number)
        .classList.add("active");


    if (number === 2) {

        startQuestion();

    }


    if (number === 3) {

        stopNoMoving();

        createHearts();

    }

}


/* =========================
   Yes 버튼
========================= */

function yesClick() {

    if (questionNumber === 1) {

        questionNumber = 2;

        showSecondQuestion();

    } else {

        nextScreen(3);

    }

}


/* =========================
   두 번째 질문
========================= */

function showSecondQuestion() {

    const first =
        document.getElementById("question1");

    const second =
        document.getElementById("question2");


    first.classList.remove("show");

    first.classList.add("hide");


    setTimeout(() => {

        first.style.display = "none";

        second.style.display = "block";

        setTimeout(() => {

            second.classList.add("show");

        }, 30);

    }, 400);

}


/* =========================
   질문 시작
========================= */

function startQuestion() {

    stopNoMoving();

    questionNumber = 1;


    const first =
        document.getElementById("question1");

    const second =
        document.getElementById("question2");


    first.style.display = "block";

    first.classList.remove("hide");

    first.classList.add("show");


    second.style.display = "none";

    second.classList.remove("show");


    resetNoButton();

    startNoMoving();

}


/* =========================
   No 초기 위치
========================= */

function resetNoButton() {

    const no =
        document.getElementById("noButton");


    no.style.left = "50%";

    no.style.top = "10px";

    no.style.transform =
        "translateX(15px)";

}


/* =========================
   No 자동 도망 시작
========================= */

function startNoMoving() {

    stopNoMoving();


    /*
       처음부터 바로 움직이지 않고
       잠깐 보여준 뒤 도망
    */

    noMoveTimer = setInterval(() => {

        moveNoButton();

    }, 800);

}


/* =========================
   No 움직이기
========================= */

function moveNoButton() {

    const card =
        document.querySelector(".card");

    const no =
        document.getElementById("noButton");


    if (!document
        .getElementById("screen2")
        .classList
        .contains("active")) {

        return;

    }


    const padding = 15;


    const cardWidth =
        card.clientWidth;


    const cardHeight =
        card.clientHeight;


    const buttonWidth =
        no.offsetWidth;


    const buttonHeight =
        no.offsetHeight;


    const maxX =
        cardWidth
        - buttonWidth
        - padding;


    const maxY =
        cardHeight
        - buttonHeight
        - padding;


    const x =
        padding +
        Math.random() *
        Math.max(1, maxX - padding);


    const y =
        padding +
        Math.random() *
        Math.max(1, maxY - padding);


    no.style.transform =
        "translateX(0)";


    no.style.left =
        x + "px";


    no.style.top =
        y + "px";

}


/* =========================
   No 도망 멈추기
========================= */

function stopNoMoving() {

    if (noMoveTimer !== null) {

        clearInterval(noMoveTimer);

        noMoveTimer = null;

    }

}


/* =========================
   하트 생성
========================= */

function createHearts() {

    for (let i = 0; i < 12; i++) {

        const heart =
            document.createElement("div");


        heart.className =
            "floating-heart";


        heart.innerText =
            "♡";


        heart.style.left =
            (Math.random() * 90 + 5) + "%";


        heart.style.bottom =
            (Math.random() * 30 + 20) + "%";


        heart.style.animationDelay =
            (Math.random() * 0.5) + "s";


        document
            .querySelector(".card")
            .appendChild(heart);


        setTimeout(() => {

            heart.remove();

        }, 2000);

    }

}

</script>

</body>
</html>
