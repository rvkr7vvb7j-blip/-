<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>편지왔다롱~ 💌</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: transparent;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, "Noto Sans KR", sans-serif;
}


/* 카드 */

.card {
    position: relative;
    width: 330px;
    height: 500px;
    max-width: 85vw;

    background: white;
    border-radius: 24px;

    box-shadow: 0 10px 30px rgba(150,70,100,.12);

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* 모든 화면 */

.page {
    position: absolute;

    width: 100%;
    height: 100%;

    display: none;

    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
}

.page.active {
    display: flex;
}


/* 등장 효과 */

.page.active > * {
    animation: appear .45s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* 봉투 */

.envelope {
    font-size: 75px;
    margin-bottom: 20px;

    animation: envelopeMove 2s ease-in-out infinite !important;
}

@keyframes envelopeMove {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


/* 글씨 */

h1 {
    margin: 10px 0 20px;

    color: #c94b75;

    font-size: 24px;

    line-height: 1.5;
}


/* 열어보기 */

.open-btn {
    border: 0;

    padding: 14px 28px;

    border-radius: 40px;

    background: #e45b86;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 6px 15px rgba(228,91,134,.25);
}


/* 질문 */

.question-buttons {
    position: relative;

    width: 270px;
    height: 190px;

    margin-top: 0;
}


/* Yes */

.yes-btn {
    position: absolute;

    left: 55px;
    top: 10px;

    border: 0;

    padding: 13px 28px;

    border-radius: 30px;

    background: #e45b86;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    z-index: 2;
}


/* No */

.no-btn {
    position: absolute;

    left: 155px;
    top: 10px;

    border: 0;

    padding: 13px 28px;

    border-radius: 30px;

    background: #eeeeee;
    color: #888888;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition:
        left .35s ease,
        top .35s ease;
}


/* 🙈🎀 */

.cute {
    font-size: 58px;

    line-height: 1;

    animation: cuteMove 1.5s ease-in-out infinite !important;
}

@keyframes cuteMove {

    0%,100% {
        transform: translateY(0) rotate(0deg) scale(1);
    }

    25% {
        transform: translateY(-5px) rotate(-3deg) scale(1.03);
    }

    50% {
        transform: translateY(0) rotate(0deg) scale(1.06);
    }

    75% {
        transform: translateY(-5px) rotate(3deg) scale(1.03);
    }
}


/* 나듀 */

.nadeu {
    margin-top: 2px;

    color: #c94b75;

    font-size: 10px;
    font-weight: bold;
}


/* 하트 */

.heart {
    position: absolute;

    font-size: 20px;

    pointer-events: none;

    animation: heartUp 1.5s ease-out forwards;
}

@keyframes heartUp {

    from {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    to {
        opacity: 0;
        transform: translateY(-180px) scale(1.5);
    }
}

</style>
</head>


<body>

<div class="card">


    <!-- =========================
         1. 편지
    ========================== -->

    <div
        class="page active"
        id="page1"
    >

        <div class="envelope">
            💌
        </div>

        <h1>
            편지왔다롱~ 💌
        </h1>

        <button
            class="open-btn"
            onclick="showPage(2)"
        >
            열어보기 💗
        </button>

    </div>


    <!-- =========================
         2. 사랑하지?
    ========================== -->

    <div
        class="page"
        id="page2"
    >

        <h1>
            나 사랑하지?? 🥺
        </h1>

        <div
            class="question-buttons"
            id="buttons1"
        >

            <button
                class="yes-btn"
                onclick="showPage(3)"
            >
                Yes
            </button>

            <button
                class="no-btn"
                id="no1"
            >
                No
            </button>

        </div>

    </div>


    <!-- =========================
         3. 보고싶지?
    ========================== -->

    <div
        class="page"
        id="page3"
    >

        <h1>
            나 보고싶지?? 💗
        </h1>

        <div
            class="question-buttons"
            id="buttons2"
        >

            <button
                class="yes-btn"
                onclick="showPage(4)"
            >
                Yes
            </button>

            <button
                class="no-btn"
                id="no2"
            >
                No
            </button>

        </div>

    </div>


    <!-- =========================
         4. 마지막
    ========================== -->

    <div
        class="page"
        id="page4"
    >

        <div class="cute">
            🙈🎀
        </div>

        <div class="nadeu">
            나듀ㅋ
        </div>

    </div>

</div>


<script>

let currentPage = 1;

let timer1 = null;
let timer2 = null;


/* =========================
   페이지 이동
========================= */

function showPage(pageNumber) {

    document
        .querySelectorAll(".page")
        .forEach(function(page) {
            page.classList.remove("active");
        });


    document
        .getElementById("page" + pageNumber)
        .classList.add("active");


    currentPage = pageNumber;


    /* 첫 번째 질문 */

    if (pageNumber === 2) {

        startNo("no1", 1);

    }


    /* 두 번째 질문 */

    else if (pageNumber === 3) {

        stopNo1();

        startNo("no2", 2);

    }


    /* 마지막 */

    else if (pageNumber === 4) {

        stopNo1();
        stopNo2();

        makeHearts();

    }

}


/* =========================
   No 움직이기 시작
========================= */

function startNo(id, number) {

    let no =
        document.getElementById(id);

    let area =
        no.parentElement;


    /* 처음 위치 */

    no.style.left = "155px";
    no.style.top = "10px";


    /* 바로 한 번 움직이기 */

    setTimeout(function() {

        if (currentPage === number + 1) {
            moveNo(no, area);
        }

    }, 500);


    /* 계속 움직이기 */

    if (number === 1) {

        clearInterval(timer1);

        timer1 = setInterval(function() {

            if (currentPage === 2) {
                moveNo(no, area);
            }

        }, 800);

    }


    if (number === 2) {

        clearInterval(timer2);

        timer2 = setInterval(function() {

            if (currentPage === 3) {
                moveNo(no, area);
            }

        }, 800);

    }

}


/* =========================
   No 랜덤 이동
========================= */

function moveNo(no, area) {

    let maxX =
        area.clientWidth - no.offsetWidth;

    let maxY =
        area.clientHeight - no.offsetHeight;


    let x =
        Math.random() * Math.max(1, maxX);

    let y =
        Math.random() * Math.max(1, maxY);


    no.style.left = x + "px";
    no.style.top = y + "px";

}


/* =========================
   타이머 정지
========================= */

function stopNo1() {

    if (timer1 !== null) {

        clearInterval(timer1);

        timer1 = null;

    }

}


function stopNo2() {

    if (timer2 !== null) {

        clearInterval(timer2);

        timer2 = null;

    }

}


/* =========================
   하트
========================= */

function makeHearts() {

    const card =
        document.querySelector(".card");


    for (let i = 0; i < 12; i++) {

        const heart =
            document.createElement("div");


        heart.className = "heart";

        heart.innerText = "♡";


        heart.style.left =
            (Math.random() * 90 + 5) + "%";


        heart.style.bottom =
            (Math.random() * 30 + 20) + "%";


        heart.style.animationDelay =
            (Math.random() * .5) + "s";


        card.appendChild(heart);


        setTimeout(function() {

            heart.remove();

        }, 2000);

    }

}

</script>

</body>
</html>
