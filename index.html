<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>편지왔다롱~ 💌</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f9dce7;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, "Noto Sans KR", sans-serif;
    overflow: hidden;
}

.card {
    width: min(88vw, 430px);
    min-height: 720px;
    background: white;
    border-radius: 24px;
    padding: 40px 25px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-shadow: 0 10px 30px rgba(150, 70, 100, 0.12);
    position: relative;
    overflow: hidden;
}


/* =========================
   화면
========================= */

.screen {
    width: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: fadeIn .5s ease;
}

.screen.active {
    display: flex;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================
   봉투
========================= */

.envelope {
    font-size: 90px;
    margin-bottom: 25px;
    animation: floating 2s ease-in-out infinite;
}

@keyframes floating {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


/* =========================
   글씨
========================= */

h1 {
    color: #c94b75;
    font-size: 25px;
    margin: 10px 0 15px;
    line-height: 1.5;
}

p {
    color: #777;
    font-size: 15px;
    margin: 8px 0 25px;
}


/* =========================
   버튼
========================= */

button {
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: .2s;
}

.main-btn {
    background: #e45b86;
    color: white;
    border-radius: 40px;
    padding: 15px 30px;
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 6px 15px rgba(228,91,134,.25);
}

.main-btn:hover {
    transform: scale(1.05);
}


/* =========================
   Yes / No
========================= */

.choices {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 10px;
}

.choice {
    padding: 13px 30px;
    border-radius: 30px;
    background: #e45b86;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.choice:hover {
    transform: scale(1.05);
}

.choice.no {
    background: #eee;
    color: #888;
}


/* =========================
   질문 변경
========================= */

.question {
    transition: opacity .5s ease, transform .5s ease;
}

.question.hide {
    opacity: 0;
    transform: translateY(-10px);
}

.question.show {
    opacity: 1;
    transform: translateY(0);
}


/* =========================
   고양이 GIF
========================= */

.cat-gif {
    width: 220px;
    max-width: 75%;
    border-radius: 15px;
    display: block;
    margin-bottom: 20px;
}


/* =========================
   사룽해
========================= */

.love-text {
    color: #c94b75;
    font-size: 30px;
    font-weight: 900;
    margin: 10px 0;
}


/* =========================
   날아다니는 하트
========================= */

.floating-heart {
    position: absolute;
    font-size: 20px;
    pointer-events: none;
    animation: fly 1.5s ease-out forwards;
}

@keyframes fly {
    0% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    100% {
        opacity: 0;
        transform: translateY(-180px) scale(1.5);
    }
}

</style>
</head>


<body>

<div class="card">


    <!-- =================================
         첫 번째 화면
    ================================= -->

    <div class="screen active" id="screen1">

        <div class="envelope">
            💌
        </div>

        <h1>
            편지왔다롱~💌
        </h1>

        <button
            class="main-btn"
            onclick="nextScreen(2)"
        >
            열어보기💗
        </button>

    </div>



    <!-- =================================
         두 번째 화면
    ================================= -->

    <div class="screen" id="screen2">

        <!-- 처음 나오는 문구 -->

        <h1
            id="question1"
            class="question show"
        >
            나 사랑하지??🥺
        </h1>


        <!-- 1.5초 후 나오는 문구 -->

        <h1
            id="question2"
            class="question"
            style="display:none;"
        >
            나 보고싶지??💗
        </h1>


        <!-- Yes / No 버튼 -->

        <div class="choices">

            <button
                class="choice"
                onclick="nextScreen(3)"
            >
                Yes
            </button>

            <button
                class="choice no"
                onclick="nope()"
            >
                No
            </button>

        </div>


        <div
            class="small"
            id="noText"
        ></div>

    </div>



    <!-- =================================
         세 번째 화면
    ================================= -->

    <div class="screen" id="screen3">

        <!--
            카툰 고양이 GIF

            HTML 파일과 같은 폴더에
            cat.gif 파일을 넣어주세요.
        -->

        <img
            src="cat.gif"
            alt="부끄러워하는 카툰 고양이"
            class="cat-gif"
        >


        <h1 class="love-text">
            사룽해.
        </h1>

    </div>


</div>



<script>

/* =========================
   화면 이동
========================= */

function nextScreen(number) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {
            screen.classList.remove("active");
        });


    document
        .getElementById("screen" + number)
        .classList.add("active");


    /* 두 번째 화면에 들어왔을 때
       질문 변경 시작 */

    if (number === 2) {
        startQuestionChange();
    }


    /* 세 번째 화면에 들어왔을 때
       하트 효과 */

    if (number === 3) {
        createHearts();
    }

}


/* =========================
   No 버튼
========================= */

function nope() {

    const text =
        document.getElementById("noText");


    text.innerText =
        "뭐야... 다시 생각해봐 🥺";


    setTimeout(() => {
        text.innerText = "";
    }, 1500);

}


/* =========================
   하트 효과
========================= */

function createHearts() {

    for (let i = 0; i < 12; i++) {

        const heart =
            document.createElement("div");


        heart.className =
            "floating-heart";


        heart.innerText =
            "♡";


        heart.style.left =
            Math.random() * 90 + 5 + "%";


        heart.style.bottom =
            Math.random() * 30 + 20 + "%";


        heart.style.animationDelay =
            Math.random() * 0.5 + "s";


        document
            .querySelector(".card")
            .appendChild(heart);


        setTimeout(() => {
            heart.remove();
        }, 2000);

    }

}


/* =========================
   질문 변경
========================= */

let questionTimer;

function startQuestionChange() {

    clearTimeout(questionTimer);


    /* 처음 상태로 다시 설정 */

    const first =
        document.getElementById("question1");

    const second =
        document.getElementById("question2");


    first.style.display =
        "block";

    first.classList.remove("hide");
    first.classList.add("show");


    second.style.display =
        "none";

    second.classList.remove("show");


    /* 1.5초 후 변경 */

    questionTimer =
        setTimeout(() => {

            first.classList.remove("show");
            first.classList.add("hide");


            setTimeout(() => {

                first.style.display =
                    "none";


                second.style.display =
                    "block";


                setTimeout(() => {

                    second.classList.add("show");

                }, 50);


            }, 500);


        }, 1500);

}

</script>

</body>
</html>
