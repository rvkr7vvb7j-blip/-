<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>편지왔다롱~ 💌</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: transparent;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, "Noto Sans KR", sans-serif;
    overflow: hidden;
}


/* 편지 */

.card {
    width: min(330px, 85vw);
    height: min(500px, 80vh);

    background: white;
    border-radius: 24px;

    padding: 30px 20px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    box-shadow:
        0 10px 30px rgba(150, 70, 100, 0.15);

    position: relative;
    overflow: hidden;

    animation: cardFloat 3s ease-in-out infinite;
}

@keyframes cardFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


/* 화면 */

.screen {
    width: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: fadeIn .5s ease;
}

.screen.active {
    display: flex;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* 봉투 */

.envelope {
    font-size: 75px;
    margin-bottom: 20px;

    animation:
        envelopeFloat 2s ease-in-out infinite;
}

@keyframes envelopeFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


/* 글씨 */

h1 {
    color: #c94b75;
    font-size: 23px;
    margin: 10px 0 20px;
    line-height: 1.5;
}


/* 버튼 */

button {
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: .2s;
}

.main-btn {
    background: #e45b86;
    color: white;

    border-radius: 40px;

    padding: 13px 25px;

    font-size: 16px;
    font-weight: bold;

    box-shadow:
        0 6px 15px rgba(228,91,134,.25);
}

.main-btn:hover {
    transform: scale(1.05);
}


/* Yes / No */

.choices {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 10px;
}

.choice {
    padding: 12px 27px;

    border-radius: 30px;

    background: #e45b86;
    color: white;

    font-size: 15px;
    font-weight: bold;
}

.choice:hover {
    transform: scale(1.05);
}

.choice.no {
    background: #eee;
    color: #888;
}


/* 질문 */

.question {
    transition:
        opacity .5s ease,
        transform .5s ease;
}

.question.hide {
    opacity: 0;
    transform: translateY(-10px);
}

.question.show {
    opacity: 1;
    transform: translateY(0);
}


/* 고양이 */

.cat-gif {
    width: 230px;
    max-width: 80%;

    border-radius: 15px;

    display: block;

    margin-bottom: 15px;

    animation:
        catCute 1.8s ease-in-out infinite;
}


/* 고양이 통통 움직이기 */

@keyframes catCute {

    0%, 100% {
        transform:
            translateY(0)
            rotate(0deg)
            scale(1);
    }

    25% {
        transform:
            translateY(-6px)
            rotate(-2deg)
            scale(1.02);
    }

    50% {
        transform:
            translateY(0)
            rotate(0deg)
            scale(1.04);
    }

    75% {
        transform:
            translateY(-6px)
            rotate(2deg)
            scale(1.02);
    }
}


/*💝*/

.love-text {
    color: #c94b75;

    font-size: 29px;

    font-weight: 900;

    margin: 10px 0;
}


/* No 문구 */

.small {
    font-size: 13px;
    color: #999;
    margin-top: 20px;
}


/* 하트 */

.floating-heart {
    position: absolute;

    font-size: 20px;

    pointer-events: none;

    animation:
        fly 1.5s ease-out forwards;
}

@keyframes fly {

    0% {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            translateY(-180px)
            scale(1.5);
    }
}

</style>
</head>


<body>

<div class="card">


    <!-- 첫 번째 화면 -->

    <div
        class="screen active"
        id="screen1"
    >

        <div class="envelope">
            💌
        </div>

        <h1>
            편지왔다롱~💌
        </h1>

        <button
            class="main-btn"
            onclick="nextScreen(2)"
        >
            열어보기💗
        </button>

    </div>



    <!-- 두 번째 화면 -->

    <div
        class="screen"
        id="screen2"
    >

        <h1
            id="question1"
            class="question show"
        >
            나 사랑하지??🥺
        </h1>


        <h1
            id="question2"
            class="question"
            style="display:none;"
        >
            나 보고싶지??💗
        </h1>


        <div class="choices">

            <button
                class="choice"
                onclick="nextScreen(3)"
            >
                Yes
            </button>


            <button
                class="choice no"
                onclick="nope()"
            >
                No
            </button>

        </div>


        <div
            class="small"
            id="noText"
        ></div>

    </div>



    <!-- 세 번째 화면 -->

    <div
        class="screen"
        id="screen3"
    >

        <img
            class="cat-gif"
            alt="부끄러운 카툰 고양이"
            src="data:image/jpeg;base64,여기에_사진데이터가_들어감"
        >


        <h1 class="love-text">
            💝
        </h1>

    </div>


</div>



<script>

let questionTimer;


/* 화면 이동 */

function nextScreen(number) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });


    document
        .getElementById("screen" + number)
        .classList.add("active");


    if (number === 2) {
        startQuestionChange();
    }


    if (number === 3) {
        createHearts();
    }

}


/* No 버튼 */

function nope() {

    const text =
        document.getElementById("noText");


    text.innerText =
        "뭐야... 다시 생각해봐 🥺";


    setTimeout(() => {

        text.innerText = "";

    }, 1500);

}


/* 하트 효과 */

function createHearts() {

    for (let i = 0; i < 12; i++) {

        const heart =
            document.createElement("div");


        heart.className =
            "floating-heart";


        heart.innerText =
            "♡";


        heart.style.left =
            Math.random() * 90 + 5 + "%";


        heart.style.bottom =
            Math.random() * 30 + 20 + "%";


        heart.style.animationDelay =
            Math.random() * 0.5 + "s";


        document
            .querySelector(".card")
            .appendChild(heart);


        setTimeout(() => {

            heart.remove();

        }, 2000);

    }

}


/* 질문 변경 */

function startQuestionChange() {

    clearTimeout(questionTimer);

    const first =
        document.getElementById("question1");

    const second =
        document.getElementById("question2");


    first.style.display =
        "block";

    first.classList.remove("hide");
    first.classList.add("show");


    second.style.display =
        "none";

    second.classList.remove("show");


    questionTimer =
        setTimeout(() => {

            first.classList.remove("show");
            first.classList.add("hide");


            setTimeout(() => {

                first.style.display =
                    "none";

                second.style.display =
                    "block";


                setTimeout(() => {

                    second.classList.add("show");

                }, 50);

            }, 500);

        }, 1500);

}

</script>

</body>
</html>
