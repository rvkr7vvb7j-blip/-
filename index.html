<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>편지왔다롱~ 💌</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: transparent;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, "Noto Sans KR", sans-serif;
    overflow: hidden;
}

.card {
    width: min(330px, 85vw);
    min-height: 500px;
    background: white;
    border-radius: 24px;
    padding: 40px 25px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-shadow: 0 10px 30px rgba(150,70,100,.12);
    position: relative;
    overflow: hidden;
    animation: cardFloat 3s ease-in-out infinite;
}

@keyframes cardFloat {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

.screen {
    width: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: fadeIn .5s ease;
}

.screen.active {
    display: flex;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.envelope {
    font-size: 90px;
    margin-bottom: 25px;
    animation: floating 2s ease-in-out infinite;
}

@keyframes floating {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

h1 {
    color: #c94b75;
    font-size: 25px;
    margin: 10px 0 15px;
    line-height: 1.5;
}

button {
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: .2s;
}

.main-btn {
    background: #e45b86;
    color: white;
    border-radius: 40px;
    padding: 15px 30px;
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 6px 15px rgba(228,91,134,.25);
}

.main-btn:hover {
    transform: scale(1.05);
}

.choices {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 10px;
}

.choice {
    padding: 13px 30px;
    border-radius: 30px;
    background: #e45b86;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.choice:hover {
    transform: scale(1.05);
}

.choice.no {
    background: #eee;
    color: #888;
}

.question {
    transition: opacity .5s ease, transform .5s ease;
}

.question.hide {
    opacity: 0;
    transform: translateY(-10px);
}

.question.show {
    opacity: 1;
    transform: translateY(0);
}

.small {
    color: #999;
    font-size: 13px;
    margin-top: 20px;
}

.cute {
    font-size: 65px;
    margin-bottom: 3px;
    animation: cuteFloat 1.5s ease-in-out infinite;
}

@keyframes cuteFloat {
    0%,100% {
        transform: translateY(0) rotate(0deg);
    }

    25% {
        transform: translateY(-5px) rotate(-3deg);
    }

    50% {
        transform: translateY(0) scale(1.04);
    }

    75% {
        transform: translateY(-5px) rotate(3deg);
    }
}

.nadeu {
    color: #c94b75;
    font-size: 10px;
    font-weight: bold;
    margin-top: 0;
}

.floating-heart {
    position: absolute;
    font-size: 20px;
    pointer-events: none;
    animation: fly 1.5s ease-out forwards;
}

@keyframes fly {
    0% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    100% {
        opacity: 0;
        transform: translateY(-180px) scale(1.5);
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="screen active" id="screen1">

        <div class="envelope">
            💌
        </div>

        <h1>
            편지왔다롱~ 💌
        </h1>

        <button class="main-btn" onclick="nextScreen(2)">
            열어보기 💗
        </button>

    </div>


    <div class="screen" id="screen2">

        <h1 id="question1" class="question show">
            나 사랑하지?? 🥺
        </h1>

        <h1 id="question2" class="question" style="display:none;">
            나 보고싶지?? 💗
        </h1>

        <div class="choices">

            <button class="choice" onclick="nextScreen(3)">
                Yes
            </button>

            <button class="choice no" onclick="nope()">
                No
            </button>

        </div>

        <div class="small" id="noText"></div>

    </div>


    <div class="screen" id="screen3">

        <div class="cute">
            🙈🎀
        </div>

        <div class="nadeu">
            나듀.
        </div>

    </div>

</div>

<script>

let questionTimer;

function nextScreen(number) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {
            screen.classList.remove("active");
        });

    document
        .getElementById("screen" + number)
        .classList.add("active");

    if (number === 2) {
        startQuestionChange();
    }

    if (number === 3) {
        createHearts();
    }
}

function nope() {

    const text = document.getElementById("noText");

    text.innerText = "뭐야... 다시 생각해봐 🥺";

    setTimeout(() => {
        text.innerText = "";
    }, 1500);
}

function createHearts() {

    for (let i = 0; i < 12; i++) {

        const heart = document.createElement("div");

        heart.className = "floating-heart";

        heart.innerText = "♡";

        heart.style.left =
            Math.random() * 90 + 5 + "%";

        heart.style.bottom =
            Math.random() * 30 + 20 + "%";

        heart.style.animationDelay =
            Math.random() * 0.5 + "s";

        document
            .querySelector(".card")
            .appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 2000);
    }
}

function startQuestionChange() {

    clearTimeout(questionTimer);

    const first =
        document.getElementById("question1");

    const second =
        document.getElementById("question2");

    first.style.display = "block";
    first.classList.remove("hide");
    first.classList.add("show");

    second.style.display = "none";
    second.classList.remove("show");

    questionTimer = setTimeout(() => {

        first.classList.remove("show");
        first.classList.add("hide");

        setTimeout(() => {

            first.style.display = "none";

            second.style.display = "block";

            setTimeout(() => {
                second.classList.add("show");
            }, 50);

        }, 500);

    }, 1500);
}

</script>

</body>
</html>
