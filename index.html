<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>편지왔다롱~ 💌</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, "Noto Sans KR", sans-serif;
    overflow: hidden;
}

.card {
    width: 330px;
    max-width: 85vw;
    height: 500px;

    background: white;
    border-radius: 24px;

    padding: 35px 25px;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    box-shadow: 0 10px 30px rgba(150,70,100,.12);

    position: relative;
    overflow: hidden;
}

.screen {
    width: 100%;
    height: 100%;

    display: none;

    flex-direction: column;
    justify-content: center;
    align-items: center;

    animation: fadeIn .5s ease;
}

.screen.active {
    display: flex;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.envelope {
    font-size: 75px;
    margin-bottom: 20px;

    animation: floating 2s ease-in-out infinite;
}

@keyframes floating {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

h1 {
    color: #c94b75;
    font-size: 24px;
    margin: 10px 0 20px;
    line-height: 1.5;
}

button {
    border: none;
    cursor: pointer;
    font-family: inherit;
}

.main-btn {
    background: #e45b86;
    color: white;

    border-radius: 40px;

    padding: 14px 28px;

    font-size: 16px;
    font-weight: bold;

    box-shadow: 0 6px 15px rgba(228,91,134,.25);
}

.choices {
    width: 100%;
    height: 180px;

    position: relative;
    margin-top: 5px;
}

.choice {
    position: absolute;

    padding: 13px 28px;

    border-radius: 30px;

    font-size: 16px;
    font-weight: bold;
}

.yes {
    background: #e45b86;
    color: white;

    left: 35%;
    top: 10px;

    z-index: 5;
}

.no {
    background: #eeeeee;
    color: #888888;

    left: 55%;
    top: 10px;

    transition:
        left .3s ease,
        top .3s ease;
}

.cute {
    font-size: 60px;

    margin-bottom: 3px;

    animation: cuteMove 1.5s ease-in-out infinite;
}

@keyframes cuteMove {
    0%,100% {
        transform: translateY(0) rotate(0deg) scale(1);
    }

    25% {
        transform: translateY(-5px) rotate(-3deg) scale(1.03);
    }

    50% {
        transform: translateY(0) rotate(0deg) scale(1.06);
    }

    75% {
        transform: translateY(-5px) rotate(3deg) scale(1.03);
    }
}

.nadeu {
    color: #c94b75;
    font-size: 10px;
    font-weight: bold;
    margin-top: 0;
}

.floating-heart {
    position: absolute;

    font-size: 20px;

    pointer-events: none;

    animation: fly 1.5s ease-out forwards;
}

@keyframes fly {
    0% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    100% {
        opacity: 0;
        transform: translateY(-180px) scale(1.5);
    }
}
</style>
</head>


<body>

<div class="card">

    <!-- 첫 화면 -->
    <div class="screen active" id="screen1">

        <div class="envelope">💌</div>

        <h1>편지왔다롱~ 💌</h1>

        <button class="main-btn" onclick="goTo(2)">
            열어보기 💗
        </button>

    </div>


    <!-- 첫 번째 질문 -->
    <div class="screen" id="screen2">

        <h1>
            나 사랑하지?? 🥺
        </h1>

        <div class="choices">

            <button
                class="choice yes"
                onclick="goTo(3)"
            >
                Yes
            </button>

            <button
                class="choice no"
                id="no1"
            >
                No
            </button>

        </div>

    </div>


    <!-- 두 번째 질문 -->
    <div class="screen" id="screen3">

        <h1>
            나 보고싶지?? 💗
        </h1>

        <div class="choices">

            <button
                class="choice yes"
                onclick="goTo(4)"
            >
                Yes
            </button>

            <button
                class="choice no"
                id="no2"
            >
                No
            </button>

        </div>

    </div>


    <!-- 마지막 -->
    <div class="screen" id="screen4">

        <div class="cute">
            🙈🎀
        </div>

        <div class="nadeu">
            나듀.
        </div>

    </div>

</div>


<script>

let moveTimer1;
let moveTimer2;


/* 화면 이동 */

function goTo(number) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {
            screen.classList.remove("active");
        });

    document
        .getElementById("screen" + number)
        .classList.add("active");


    if (number === 2) {
        startRunning("no1");
    }

    if (number === 3) {
        stopRunning1();
        startRunning("no2");
    }

    if (number === 4) {
        stopRunning1();
        stopRunning2();
        createHearts();
    }
}


/* No 도망 */

function startRunning(id) {

    const button =
        document.getElementById(id);

    if (id === "no1") {

        clearInterval(moveTimer1);

        moveTimer1 = setInterval(() => {
            moveButton(button);
        }, 700);

    } else {

        clearInterval(moveTimer2);

        moveTimer2 = setInterval(() => {
            moveButton(button);
        }, 700);

    }
}


/* 랜덤 위치 */

function moveButton(button) {

    const choices =
        button.parentElement;

    const width =
        choices.clientWidth;

    const height =
        choices.clientHeight;

    const buttonWidth =
        button.offsetWidth;

    const buttonHeight =
        button.offsetHeight;


    const maxX =
        width - buttonWidth;

    const maxY =
        height - buttonHeight;


    button.style.left =
        Math.random() * Math.max(0, maxX) + "px";

    button.style.top =
        Math.random() * Math.max(0, maxY) + "px";
}


/* 타이머 정리 */

function stopRunning1() {
    clearInterval(moveTimer1);
}

function stopRunning2() {
    clearInterval(moveTimer2);
}


/* 하트 */

function createHearts() {

    for (let i = 0; i < 12; i++) {

        const heart =
            document.createElement("div");

        heart.className =
            "floating-heart";

        heart.innerText =
            "♡";

        heart.style.left =
            (Math.random() * 90 + 5) + "%";

        heart.style.bottom =
            (Math.random() * 30 + 20) + "%";

        heart.style.animationDelay =
            (Math.random() * .5) + "s";

        document
            .querySelector(".card")
            .appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 2000);
    }
}

</script>

</body>
</html>
